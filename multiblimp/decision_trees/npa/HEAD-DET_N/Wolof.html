  }, { passive: false });

  // Drag-to-pan, but only when the drag starts on empty canvas -- starting
  // on a node needs to stay a plain click (selecting it), not compete with
  // panning for the same gesture.
  let panState = null;
  treeBox.addEventListener('mousedown', e => {
    if (e.target.closest('.node-box') || e.target.closest('.zoom-controls') || e.target.closest('.info-panel')) return;
    panState = { startX: e.clientX, startY: e.clientY, origTx: zoom.tx, origTy: zoom.ty };
    treeBox.classList.add('panning');
  });
  window.addEventListener('mousemove', e => {
    if (!panState) return;
    // Screen-space mouse movement divided by contentScale for the same
    // reason as the wheel handler's cursor offset: zoom.tx/ty live in
    // treeBox's untransformed local frame, so a real on-screen drag of N px
    // should move content by N/contentScale local units to track the
    // cursor 1:1.
    zoom.tx = panState.origTx + (e.clientX - panState.startX) / contentScale;
    zoom.ty = panState.origTy + (e.clientY - panState.startY) / contentScale;
    applyZoom();
  });
  window.addEventListener('mouseup', () => {
    if (panState) { panState = null; treeBox.classList.remove('panning'); }
  });

  // Re-fit whenever the *available* space changes, for any reason -- not
  // just a window resize event. treeBox itself is always CANVAS_W x
  // CANVAS_H now (see sizeTreeBox()), so it never fires its own resize;
  // treeScroll is the element whose actual rendered width sizeTreeBox()
  // reads as maxW, so a ResizeObserver on it also catches the available
  // width changing for reasons that never fire "resize" on window at all:
  // this artifact's own panel narrowing, a host page's sidebar toggling, a
  // container query breakpoint, etc. Without this, fitScale stays keyed to
  // whatever space was available at the last real window resize, so the
  // fitted tree can end up sized for a card that no longer exists, spilling
  // out past the page's own edge instead of shrinking with it.
  let resizeTimer = null;
  const scheduleRefit = () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { sizeTreeBox(); fitToContent(); }, 150);
  };
  new ResizeObserver(scheduleRefit).observe(treeScroll);
  // Kept alongside the observer above, not replaced by it: an actual
  // window resize always fires this reliably, so it's a guaranteed
  // fallback in case something about a given host page's layout ever
  // stops treeScroll's own box size from changing in step with the window
  // (e.g. a CSS containment quirk) -- redundant in the common case, but
  // that just means fitToContent() gets called twice, which is harmless.
  window.addEventListener('resize', scheduleRefit);

  function widthFor(childN, parentN) { return Math.max(2, (childN / parentN) * 15); }
  function ns(tag) { return document.createElementNS('http://www.w3.org/2000/svg', tag); }
  function varName(cssVal) { return cssVal.match(/--[a-z-]+/)[0]; }

  // Tags the sentence's two bolded tokens by role (case-insensitive match,
  // since sentence-initial capitalization can differ from the stored form),
  // so the same tok-a/tok-b classes color them exactly like the matching
  // role's row in the feature table below.
  function tagRoleTokens(html, formA, formB) {
    return html.replace(/<strong>(.*?)<\/strong>/g, (match, word) => {
      const w = word.toLowerCase();
      if (w === String(formA).toLowerCase()) return `<strong class="tok-a">${word}</strong>`;
      if (w === String(formB).toLowerCase()) return `<strong class="tok-b">${word}</strong>`;
      return match;
    });
  }

  // Shared, comparable features first (this is exactly what agreement is
  // about), then role-specific morphology, then dependency-structure extras
  // (deprel/upos) used by the Hindi tree's rule checks. lemma trails those:
  // identifying context like deprel/upos, not agreement-relevant morphology,
  // but the Python side (_build_feat_columns/_v2_pair_feat_list) already
  // emits a "lemma=..." entry for every row -- it just never had a matching
  // feature column to render into.
  // Every feature the rows carry gets a column. Morphological features come
  // first (the usual ones in this order, any others alphabetically after),
  // then the token-level fields, marked off visually.
  const MORPH_ORDER = ['Number', 'Person', 'Gender', 'Case', 'Mood', 'Tense', 'Aspect', 'Voice', 'VerbForm', 'Definite', 'PronType', 'Poss', 'Reflex'];
  const OTHER_FEATS = ['lemma', 'deprel', 'upos', 'xpos'];
  function featBase(f) {
    return f.replace(/<\/?[bi]>/g, '').split('=')[0].split('[')[0];
  }
  function featColumns(featLists) {
    const seen = new Set();
    featLists.forEach(list => list.forEach(f => { const b = featBase(f); if (b) seen.add(b); }));
    const present = k => featLists.some(l => featEntry(l, k));
    const rank = k => { const i = MORPH_ORDER.indexOf(k); return i < 0 ? MORPH_ORDER.length : i; };
    const morph = [...seen].filter(k => !OTHER_FEATS.includes(k) && present(k))
      .sort((a, b) => rank(a) - rank(b) || a.localeCompare(b));
    return [...morph, ...OTHER_FEATS.filter(k => seen.has(k) && present(k))];
  }

  function featEntries(feats, key) {
    // A plain "Number=..." entry and a bracketed "Number[abs]=..." one both
    // live under the same "NUMBER" table column (one dimension, several
    // possible sources -- see _v2_pair_feat_list's own resolve_bracket_feats
    // for why obj/iobj/ergative-marked-subj agreement only ever has the
    // bracketed form), but they are never the same reading: a bracket
    // means this value came from a specific argument slot, not the token's
    // unqualified feature. And a single token can carry *more than one*
    // bracket of the same dimension at once (a transitive Basque verb's
    // Number[abs] -- the object's number -- and Number[erg] -- the
    // subject's -- both at once) -- every one of them is returned here
    // (not just the first) so the caller can show all of them, each with
    // its own bracket marker, rather than one arbitrarily winning the
    // shared column.
    const hits = feats.filter(f => {
      const clean = f.replace(/<\/?[bi]>/g, '');
      return clean.startsWith(key + '=') || clean.startsWith(key + '[');
    });
    return hits.map(hit => {
      const clean = hit.replace(/<\/?[bi]>/g, '');
      const eqIdx = clean.indexOf('=');
      const fullKey = clean.slice(0, eqIdx);
      const value = clean.slice(eqIdx + 1);
      // "nan" is the pipeline's own missing-value sentinel (see viz_tree.py's
      // "_missing" -> "nan" rewrite) -- treated the same as a feature that
      // doesn't apply to this token at all, rather than leaking the raw
      // Python string into the table.
      if (value === 'nan') return null;
      const bracket = fullKey.length > key.length ? fullKey.slice(key.length) : null;
      // bold: the decisive swap value (real violation, gets the red
      // decisive.swapped styling below). bonus: a dimension with no
      // original value at all, only a real one on the reinflected
      // candidate (see applyAfterFeat's own docstring) -- genuinely new
      // information, not a violation, so it must NOT inherit that same red
      // "this changed for the worse" color just for sharing the cell with
      // the entry that did.
      return { value, bold: hit.startsWith('<b>'), bonus: hit.startsWith('<i>'), bracket };
    }).filter(e => e !== null);
  }

  // Single-entry convenience for callers that only need "is this column
  // populated at all" (column-set computation) -- picks the first match,
  // same as the old featEntry did before it could return several.
  function featEntry(feats, key) {
    return featEntries(feats, key)[0] || null;
  }

  // Sets a minimal pair's decisive feature to its real post-swap value --
  // create_pairs' own after_{role}_{Feat}[...] column, emitted per pair as
  // p.afterValue with the exact key it was found under (plain or
  // bracketed) as p.afterFeatKey -- so the "swapped" row's other features
  // are identical to the original by construction (the same feature list,
  // only this one entry replaced), the decisive value itself is real data,
  // not a guessed opposite, and a bracketed source (e.g. "Number[abs]")
  // renders as one -- never silently relabeled as the plain "Number" the
  // original row's own entry might (or might not) also carry.
  //
  // Matches afterFeatKey EXACTLY, not just a "starts with decisiveFeat["
  // prefix: a token can carry more than one bracket of the same base
  // feature at once (Number[abs] AND Number[erg] on one Basque verb), and
  // only the one actually reinflected -- plus any TRUE alias of that same
  // argument slot -- should change. A blanket prefix match would also drop
  // genuinely different, untouched arguments that just happen to share the
  // base feature name (e.g. relabeling-away the subject's unrelated
  // Number[erg] when only the indirect object's Number[io] was swapped).
  //
  // siblingKeys (p.siblingKeys, from html_tree.py's own _v2_pair_from_row)
  // is the precise list of alias brackets create_pairs' own
  // resolve_layered_head_key would have tried for the SAME slot as
  // afterFeatKey (relation-named bracket first, e.g. "[io]", then the
  // child's own Case, e.g. "[dat]") -- both naming conventions for one
  // reading, not two (Basque iobj: [io] and [dat] both key off the same
  // indirect object). The original role's value for a sibling was real
  // (both conventions' sources happened to agree pre-swap), but the
  // swap_bundle that produced afterValue only ever reports the ONE key it
  // was actually generated under -- html_tree.py's own after_feat_key
  // resolution stops at the first populated candidate, so a sibling with no
  // after_ value has no verified post-swap reading at all. Carrying its
  // pre-swap value over here would silently claim it was checked and found
  // unchanged, when it simply was never checked -- so drop only those true
  // aliases, not every bracket of the base feature.
  //
  // bonusAfterFeats (p.bonusAfterFeats, see html_tree.py's own
  // _v2_pair_from_row) are APPENDED rather than patched into an existing
  // entry: a dimension like Basque's indirect-object Number/Person slot can
  // be entirely absent from the original word (a plain transitive form like
  // "zuen" never marks one at all) while genuinely present on the
  // reinflected candidate (a ditransitive form like "zioten" does) -- real
  // data with no original entry to replace, so it has to be added as a new
  // column instead of overwriting one.
  function applyAfterFeat(feats, decisiveFeat, afterValue, afterFeatKey, bonusAfterFeats, siblingKeys) {
    const targetKey = afterFeatKey || decisiveFeat;
    const dropKeys = new Set(siblingKeys || []);
    const patched = afterValue == null ? feats : feats.map(f => {
      const clean = f.replace(/<\/?[bi]>/g, '');
      const [key] = clean.split('=');
      if (key === targetKey) return `<b>${targetKey}=${afterValue}</b>`;
      if (key === decisiveFeat || dropKeys.has(key)) return null;
      return f;
    }).filter(f => f !== null);
    if (!bonusAfterFeats || !bonusAfterFeats.length) return patched;
    // <i>, not <b>: featEntries reads the wrapper tag to tell "the decisive
    // value actually changed" (bold, gets the red decisive.swapped color)
    // apart from "a dimension with no original value, genuinely new here"
    // (bonus) -- see its own comment for why conflating the two was wrong.
    return [...patched, ...bonusAfterFeats.map(f => `<i>${f}</i>`)];
  }

  // One row per {label, form, feats} entry x one column per feature, columns
  // limited to whichever features actually appear across all rows -- keeps a
  // trimmed pair's table narrow instead of padding it out to a fixed schema.
  // Rows flagged `linked` get a colored left rail connecting them (a role and
  // its reinflected "swapped_" counterpart); a row flagged `swapped` gets its
  // decisive cell flagged as the violation rather than the grammatical value.
  // "Why this row is here": for each split on the way from the root to the
  // current node, the rule, the branch this row took, and the row's own
  // value of the column that split looks at.
  function buildRouteTable(s, key) {
    const route = s.route || {};
    const path = T.PATHS[currentNode];
    const esc = v => String(v).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    const rows = [];
    for (let i = 0; i + 1 < path.length; i++) {
      const p = path[i], child = path[i + 1];
      const val = route[String(p)];
      if (val === undefined) continue;
      const branch = T.NODES[child].branch;
      rows.push(`<tr><th class="route-node">[${p}]</th><td class="route-rule">${nodeRuleDisplay(T.NODES[p])}</td>` +
        `<td class="route-branch ${branch}">→ ${branch === 'true' ? 'True' : 'False'}</td><td class="route-value">${esc(val)}</td></tr>`);
    }
    if (!rows.length) return '';
    const open = openRouteLabels.has(s.label);
    return `<div class="route-block" data-label="${s.label}">
      <button type="button" class="group-route-toggle" data-label="${s.label}" data-text="why this row is at node ${currentNode}" data-scroll-anchor="routerow_${key}" aria-expanded="${open}">${open ? '▾' : '▸'} why this row is at node ${currentNode}</button>
      <div class="route-body"${open ? '' : ' hidden'}><div class="feat-mini-table-wrap"><table class="feat-mini-table route-table">
        <thead><tr><th>node</th><th>split</th><th>answer</th><th>this row's value</th></tr></thead>
        <tbody>${rows.join('')}</tbody></table></div></div></div>`;
  }

  function buildFeatTable(decisiveFeat, rows, forceCols) {
    // forceCols lets a caller fix the same column set across several of
    // these tables (e.g. all 5 sample rows for a node) so they line up
    // visually -- left to compute its own columns, each table only shows
    // the features actually set for its own two rows, which drifts from
    // sample to sample.
    const cols = forceCols || featColumns(rows.map(r => r.feats));
    const firstOther = cols.findIndex(k => OTHER_FEATS.includes(k));
    const colCls = (k, i, extra) => {
      const c = [];
      if (extra) c.push(extra);
      if (OTHER_FEATS.includes(k)) c.push('other-feat');
      if (i === firstOther) c.push('other-first');
      return c;
    };
    const headHtml = cols.map((k, i) => {
      const c = colCls(k, i, k === decisiveFeat ? 'decisive' : '');
      return `<th${c.length ? ` class="${c.join(' ')}"` : ''}>${k}</th>`;
    }).join('');
    const rowHtml = (r) => {
      const cells = cols.map((k, ci) => {
        // Every entry for this column, not just one -- a token can carry
        // more than one bracket of the same dimension at once (see
        // featEntries), and all of them are shown, separated, so e.g. a
        // verb's object-agreement AND subject-agreement Number are both
        // visible and each stays comparable to the swapped role's own
        // entry for that exact bracket.
        const entries = featEntries(r.feats, k);
        const isDecisive = k === decisiveFeat;
        const cellCls = colCls(k, ci, isDecisive ? `decisive${r.variant === 'swapped' ? ' swapped' : ''}` : '');
        const cls = cellCls.length ? ` class="${cellCls.join(' ')}"` : '';
        if (!entries.length) return `<td${cls}><span class="na">–</span></td>`;
        // One line per entry, stacked vertically (feat-entry-line is
        // block-level), not joined inline with a "/" separator -- 2-3
        // bracket variants of the same dimension (e.g. a transitive verb's
        // Number[abs]/Number[erg], plus a bonus Number[io] on some rows)
        // used to force the whole table wide enough to need horizontal
        // scrolling just to read one cell; stacking keeps every table the
        // same width regardless of how many brackets a given row happens
        // to carry.
        const parts = entries.map(e => {
          // bonus first: a bonus entry is never also .bold (applyAfterFeat
          // wraps each entry with exactly one of <i>/<b>), but checking it
          // first keeps that explicit rather than relying on the ordering
          // not mattering. class="bonus-feat" is what lets the CSS below
          // override the red decisive.swapped color for just this entry,
          // without touching the real decisive value sharing its cell.
          const valueHtml = e.bonus ? `<b class="bonus-feat">${e.value}</b>`
            : e.bold ? `<b>${e.value}</b>`
            : e.value;
          const bracketHtml = e.bracket ? `<span class="feat-bracket">${e.bracket}</span>` : '';
          // A column kept out of the tree fit (e.g. the head's xpos or its
          // Number, the label itself) is still shown, dimmed with a hint.
          const fullKey = k + (e.bracket || '');
          const blocked = (T.META.fitExcluded || []).some(x => x.role === r.role && x.feat === fullKey);
          const line = `${valueHtml}${bracketHtml}`;
          return `<div class="feat-entry-line">${blocked
            ? `<span class="fit-excluded" title="Not used when fitting the tree: this feature is, or can spell out, the agreement label the tree predicts">${line}</span>`
            : line}</div>`;
        });
        return `<td${cls}>${parts.join('')}</td>`;
      }).join('');
      const rowCls = r.linked ? ' class="linked-row"' : '';
      const roleCls = r.role ? ` role-${r.role}` : '';
      return `<tr${rowCls}><th class="role-label-cell">${r.label}</th><th class="role-form-cell"><span class="role-form${roleCls}">${r.form}</span></th>${cells}</tr>`;
    };
    return `
      <div class="feat-mini-table-wrap"><table class="feat-mini-table">
        <thead><tr><th></th><th></th>${headHtml}</tr></thead>
        <tbody>
          ${rows.map(rowHtml).join('\n          ')}
        </tbody>
      </table></div>`;
  }

  function nextColor() {
    const used = new Set(active.values());
    return PALETTE.find(c => !used.has(c)) || PALETTE[active.size % PALETTE.length];
  }

  function hexToRgb(hex) {
    hex = hex.replace('#', '');
    if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
    const n = parseInt(hex, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  function interpolateHex(hex1, hex2, t) {
    const [r1, g1, b1] = hexToRgb(hex1);
    const [r2, g2, b2] = hexToRgb(hex2);
    const mix = (a, b) => Math.round(a + (b - a) * t);
    return `#${[mix(r1, r2), mix(g1, g2), mix(b1, b2)].map(v => v.toString(16).padStart(2, '0')).join('')}`;
  }

  // Node fill: majority-class color (the same real per-node dist the mini
  // bar below draws from) blended toward white in proportion to H -- the
  // exact interpolate_color(node_color, "#ffffff", relative_entropy*0.72)
  // formula decision_trees/{cond}/{lang}.html's _finalize_tree_html uses
  // (relative_entropy there is impurity/log2(n_classes), which for these
  // two-class Yes/No trees is the same binary entropy already shown as H).
  // Fixed light-mode hex, not cssVar('--yes'/'--no'): the fill is meant to
  // stay light-toned in both page themes (see the --node-fill comment
  // above), so its base color shouldn't shift with the dark-mode palette.
  // Fixed light-mode hex per semantic class, keyed the same way classColor
  // below looks them up -- interpolateHex needs a real hex to blend toward
  // white, not a var(...) reference, which is why this can't just reuse
  // classColor's/T.CLASSES's own color values directly for yes/no/unk (it
  // can for any other class, whose color already IS a real hex -- see the
  // fallback below).
  const SEMANTIC_BASE_HEX = { yes: '#14b8a6', no: '#ec4899', unk: '#a78bda' };
  function nodeFillColor(node) {
    if (!node.dist) return null;
    const majority = node.dist.reduce((a, b) => (b.cnt > a.cnt ? b : a));
    const base = SEMANTIC_BASE_HEX[majority.cls.toLowerCase()] || majority.color;
    // accuracy pages: acc in [0.5, 1] -> uncertainty in [1, 0]; entropy pages: H directly.
    const uncertainty = T.META.measure === 'accuracy' ? Math.max(0, 2 * (1 - node.acc)) : node.H;
    const t = Math.min(1, uncertainty * 0.72);
    return interpolateHex(base, '#ffffff', t);
  }

  // Looks the color up on T.CLASSES rather than hardcoding yes/no -- CLASSES
  // already carries the right var(--yes)/var(--no)/var(--unk) (or a real
  // hex fallback for anything else) per class, computed server-side.
  function classColor(cls) {
    const entry = T.CLASSES.find(c => c.cls === cls);
    return entry ? entry.color : 'var(--unk)';
  }

  // Yes/No is the real class name in the underlying data (T.CLASSES, every
  // node's dist[], each sample's label) and stays that way everywhere it's
  // used as an identifier -- grouping key, dataset key, comparisons against
  // majorityLabel. This only relabels it where it's rendered as text for a
  // reader, to "Agree"/"Disagree" (does the subject/verb, or det/head,
  // actually agree), so it can't be misread as the True/False branch
  // result shown elsewhere on the same tree -- two different yes/no-shaped
  // facts about a node that used to share the same two words. Handles the
  // rare compound case too (node 2's tied "Yes / No" leaf prediction).
  function displayLabel(cls) {
    return cls.split(' / ').map(part => {
      const lower = part.toLowerCase();
      if (lower === 'yes') return 'Agree';
      if (lower === 'no') return 'Disagree';
      if (lower === 'unk') return 'unknown';
      return part;
    }).join(' / ');
  }

  // T.roleA/T.roleB (and each pair's own swapRole 'A'/'B') are always the
  // short raw role token the pipeline used internally (UD upos-ish tags for
  // NPA -- "det", "adj", "adp", "num", "pron", "head" -- or SVA/subj_aux's
  // "nsubj"/"verb"/"aux") -- spelled out here only where it's shown to a
  // reader (the Pairs tab's role chips/group headers), the same "relabel at
  // render time, keep the raw token as the identifier everywhere else"
  // split as displayLabel above. An unrecognized token still degrades
  // gracefully to Titlecase rather than showing raw lowercase.
  const ROLE_DISPLAY_NAMES = {
    det: 'Determiner', adj: 'Adjective', adp: 'Adposition', num: 'Numeral',
    pron: 'Pronoun', head: 'Head', nsubj: 'Subject', verb: 'Verb', aux: 'Auxiliary',
  };
  function displayRole(token) {
    const key = String(token || '').toLowerCase();
    if (ROLE_DISPLAY_NAMES[key]) return ROLE_DISPLAY_NAMES[key];
    return token ? key.charAt(0).toUpperCase() + key.slice(1) : token;
  }

  // Leaf node boxes render node.rule verbatim ("predict: Yes") server-side --
  // relabel just the predicted class part through displayLabel, the same
  // way every other reader-facing Yes/No already is. Internal (split-rule)
  // nodes have no node.predicted and are returned unchanged: their rule
  // text is a feature condition, not a class name, even on the rare
  // feature whose own value happens to be the literal string "Yes"/"No".
  function nodeRuleDisplay(node) {
    if (!node.leaf || !node.predicted) return node.rule;
    return `predict: ${displayLabel(node.predicted)}`;
  }

  // One bar + count + label per class; sizing (bar width/height, font size)
  // comes entirely from the caller's CSS context (.node-dist-popover vs.
  // .node-dist-detail), so this only ever computes the fill heights.
  function buildDistColumns(dist, maxH) {
    const maxCnt = Math.max(...dist.map(d => d.cnt), 1);
    return dist.map(d => {
      const h = Math.max(2, Math.round((d.cnt / maxCnt) * maxH));
      return `
        <div class="dist-col">
          <div class="dist-col-bar-wrap"><div class="dist-col-bar" style="height:${h}px; background:${classColor(d.cls)}"></div></div>
          <div class="dist-col-count">${d.cnt.toLocaleString()}</div>
          <div class="dist-col-label">${displayLabel(d.cls)}</div>
        </div>`;
    }).join('');
  }

  function buildDistBar(node) {
    if (!node.dist) return '';
    const total = node.dist.reduce((s, d) => s + d.cnt, 0) || 1;
    // Zero-count classes are dropped before rendering, not just given 0%
    // width -- a 0%-wide segment would still take its :not(:last-child)
    // divider (a border-right renders regardless of width), producing a
    // stray line with nothing on one side of it.
    const segs = node.dist.filter(d => d.cnt > 0).map(d => {
      return `<span class="seg" style="width:${(d.cnt / total * 100).toFixed(2)}%; background:${classColor(d.cls)}"></span>`;
    }).join('');
    const hidden = showNodeDist ? '' : ' style="display:none"';
    return `
      <div class="node-dist-bar-wrap"${hidden}>
        <div class="node-dist-bar">${segs}</div>
        <div class="node-dist-popover">${buildDistColumns(node.dist, 34)}</div>
      </div>`;
  }

  function drawBaseTree() {
    treeSvg.setAttribute('viewBox', `0 0 ${CANVAS_W} ${CANVAS_H}`);
    edgesBase.innerHTML = '';
    nodesLayer.innerHTML = '';
    T.EDGES.forEach(([a, b, kind]) => {
      const A = T.NODES[a], B = T.NODES[b];
      const line = ns('line');
      const w = widthFor(B.n, A.n);
      line.setAttribute('x1', A.x); line.setAttribute('y1', A.y + 23);
      line.setAttribute('x2', B.x); line.setAttribute('y2', B.y - 23);
      line.setAttribute('stroke', kind === 'true' ? 'var(--ok)' : 'var(--danger)');
      line.setAttribute('stroke-width', w);
      line.setAttribute('stroke-linecap', 'round');
      // False ("No") branches dashed, True ("Yes") solid -- a second, shape-
      // based cue alongside the green/red color so the branch taken doesn't
      // rely on color alone (e.g. for colorblind readers, or a projector
      // that washes the red out). Dash/gap scaled to the edge's own width
      // (already variable, by sample count) so thick and thin dashed edges
      // both read as a clean "- - - -", not a blob on the thick ones.
      if (kind !== 'true') line.setAttribute('stroke-dasharray', `${w * 1.8},${w * 1.4}`);
      line.classList.add('base-edge');
      edgesBase.appendChild(line);
    });

    Object.entries(T.NODES).forEach(([id, node]) => {
      const slot = document.createElement('div');
      slot.className = 'node-slot';
      slot.dataset.node = id;
      slot.style.left = (node.x / CANVAS_W * 100) + '%';
      slot.style.top = (node.y / CANVAS_H * 100) + '%';

      // Minimal pairs are only ever generated from an Agree-majority leaf
      // (create_pairs never swaps out of a Disagree majority) -- node.keep
      // is computed from acc alone, with no majority-label check, so it can
      // still come back true for a Disagree leaf whose acc happens to clear
      // the threshold; omit the badge entirely there rather than show a
      // "kept" or "not kept" note that can't ever inform anything.
      const isAgreeLeaf = node.majorityLabel && node.majorityLabel.toLowerCase() === 'yes';
      // node.keepThresholdAcc is this leaf's own cutoff -- same value for every
      // leaf unless second_chance's depth-aware retry gave leaves different
      // ones, in which case T.META's single global number can't be trusted.
      const keepHtml = !node.leaf || !isAgreeLeaf || node.keepThresholdAcc == null ? '' : node.keep
        ? `<span class="node-keep yes${node.secondChance ? ' second-chance' : ''}" data-keep-toggle="1">🔑${node.secondChance ? '2️⃣' : ''} ${node.kept.toLocaleString()} kept${node.secondChance ? ` (acc>${node.keepThresholdAcc.toFixed(2)})` : ''} › ${node.correctSwaps.toLocaleString()} pairs ▸</span>`
        : `<span class="node-keep no">not kept (acc ${node.acc.toFixed(3)} ≤ ${node.keepThresholdAcc.toFixed(2)})</span>`;
      const fill = nodeFillColor(node);
      // [+] marker: flags a split rule where some other feature was >99%
      // correlated with the chosen one in the rows reaching this node (the
      // tree's pick was largely arbitrary among them) -- see
      // get_correlated_features in viz_tree.py. Only ever set on internal
      // (non-leaf) nodes there, same as here. Both real trees behind this
      // mockup happen to have zero correlated features at every node (a
      // real, verified fact about these two trees, not a placeholder), so
      // this renders nothing today -- the mechanism is wired for whenever a
      // tree that does have some gets dropped in.
      const corrHtml = (node.corr && node.corr.length)
        ? `<span class="corr-marker-wrap"><span class="corr-marker">[+]</span><span class="corr-popover">${node.corr.map(c => `≈ ${c}`).join('<br>')}</span></span>`
        : '';

      // No branch (True/False) badge on the node itself -- same as the real
      // decision_trees/{cond}/{lang}.html annotations, which carry no
      // direction indicator either; that's conveyed by the green/true vs.
      // red/false edge color and position alone.
      slot.innerHTML = `
        <div class="node-box">
          <div class="node-header"${fill ? ` style="--node-fill:${fill}"` : ''}>
            <span class="node-rule">${nodeRuleDisplay(node)}${corrHtml}</span>
          </div>
          <div class="node-body">
            [${id}]&nbsp; n=${node.n}&nbsp; ${T.META.measure === 'accuracy' ? `acc=${node.acc.toFixed(3)}` : `H=${node.H.toFixed(2)}`}
            ${buildDistBar(node)}
            ${keepHtml}
          </div>
        </div>`;
      nodesLayer.appendChild(slot);

      const nodeBoxEl = slot.querySelector('.node-box');
      nodeBoxEl.tabIndex = 0;
      nodeBoxEl.setAttribute('role', 'button');
      nodeBoxEl.setAttribute('aria-label', `Node ${id}: ${nodeRuleDisplay(node)}`);
      nodeBoxEl.addEventListener('click', () => onNodeClick(id));
      nodeBoxEl.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onNodeClick(id); }
      });
      const keepEl = slot.querySelector('[data-keep-toggle]');
      if (keepEl) {
        keepEl.tabIndex = 0;
        keepEl.setAttribute('role', 'button');
        keepEl.setAttribute('aria-label', `View the ${node.correctSwaps.toLocaleString()} minimal pairs this leaf produced`);
        const openPairs = e => {
          e.stopPropagation();
          openDrawer('pairs');
          selectNode(id);
          revealSelectedNode();
          setTimeout(() => jumpToLeafGroup(id), 0);
        };
        keepEl.addEventListener('click', openPairs);
        keepEl.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openPairs(e); }
        });
      }
    });
  }

  // Pooled tree + one pill per treebank tree (word_order.per_treebank).
  // A pill is tagged when that treebank's own tree beats the pooled tree on
  // the same held-out rows by a clear margin.
  function buildTreebankRow() {
    const nav = T.META.nav;
    if (!nav) return;
    const pct = v => (v * 100).toFixed(1) + '%';
    const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const pills = [`<span class="tb-label">Trees</span>`];
    const unkView = nav.variant === 'unk';
    const pAcc = unkView ? nav.pooledUnkAcc : nav.pooledAcc;
    const pN = unkView ? nav.pooledUnkTestN : nav.pooledTestN;
    // Row count the tree was actually fit on: without unk rows (as-is) or
    // with them (incl. unk).
    const rowsHtml = (n, unkN) => `${(unkView ? n + unkN : n).toLocaleString()} rows`;
    const pooledInner = `Pooled<span class="keep-count">${rowsHtml(nav.pooledRows, nav.pooledUnkRows)}${pAcc == null ? '' : ' · ' + pct(pAcc)}</span>`;
    const pooledTitle = pAcc == null ? 'All treebanks together'
      : `All treebanks together; held-out accuracy ${pct(pAcc)} on ${pN.toLocaleString()} rows${unkView ? ' (unk rows included)' : ''}`;
    pills.push(nav.pooledCurrent
      ? `<span class="tree-select-btn active" title="${pooledTitle}">${pooledInner}</span>`
      : `<a class="tree-select-btn" href="${nav.pooledHref}" title="${pooledTitle}">${pooledInner}</a>`);
    // Treebank pills stay within the current view: the as-is trees, or (on an
    // incl.-unk debugging page) the trees that also fit the unk rows.
    const unkMode = nav.variant === 'unk';
    // Excluded treebanks (never in the pooled tree or the pairs) become
    // compact chips, grouped by reason under the chevron below.
    const excludedItems = [];
    nav.items.forEach(it => {
      // In the incl.-unk view a treebank with no unk tree (e.g. a single-label
      // one) still links to its as-is page, so its pill stays reachable.
      const href = unkMode ? (it.unkHref || it.href) : (it.href || it.unkHref);
      const acc = unkMode ? it.unkAcc : it.acc;
      const noTree = it.placeholder && !(unkMode && it.unkHref);
      if (it.excluded) {
        const n = (unkMode ? it.rows + it.unkRows : it.rows).toLocaleString();
        const detail = `${it.name}: ${n} rows${acc == null ? '' : ' · ' + pct(acc) + ' held-out'}. Excluded from the minimal-pair pipeline (${it.reason || it.status}); not part of the pooled tree`;
        const inner = `${esc(it.name)}<span class="n">${n} rows${acc != null ? ' · ' + pct(acc) : noTree ? ' · ' + esc(it.status) : ''}</span>`;
        excludedItems.push({
          key: it.reason || it.status,
          chip: it.current ? `<span class="tb-chip active" title="${esc(detail)}">${inner}</span>`
            : href ? `<a class="tb-chip${noTree ? ' muted' : ''}" href="${href}" title="${esc(detail)}${noTree ? ' -- no tree, placeholder page' : ''}">${inner}</a>`
            : `<span class="tb-chip muted" title="${esc(detail)}; no tree fitted (${esc(it.status)})">${inner}</span>`,
        });
        return;
      }
      const out = pills;
      if (!href && !it.current) {
        out.push(`<span class="tree-select-btn tb-muted" title="No tree fitted: ${esc(it.status)}">${esc(it.name)}<span class="keep-count">${esc(it.status)}</span></span>`);
        return;
      }
      const unkOnly = !unkMode && !it.href;
      const title = unkMode ? 'Fit on unk rows too -- not comparable with the pooled tree'
        : unkOnly ? `${it.status} without unk rows; only the incl.-unk tree exists`
        : it.pooledAcc == null ? ''
        : `Own tree ${pct(it.acc)} vs pooled tree ${pct(it.pooledAcc)} on this treebank's held-out rows`;
      const tag = !unkMode && it.diverges ? `<span class="tb-tag">differs +${(it.delta * 100).toFixed(0)}</span>` : '';
      const accTxt = acc == null ? '' : ` · ${pct(acc)}`;
      const note = unkOnly ? ` · ${esc(it.status)}, incl. unk only` : noTree ? ` · ${esc(it.status)}` : '';
      const inner = `${esc(it.name)}<span class="keep-count">${rowsHtml(it.rows, it.unkRows)}${accTxt}${note}</span>${tag}`;
      out.push(it.current
        ? `<span class="tree-select-btn active" title="${title}">${inner}</span>`
        : `<a class="tree-select-btn${noTree ? ' tb-muted-link' : ''}" href="${href}" title="${noTree ? esc(it.status) + ' -- no tree, placeholder page with the label counts' : title}">${inner}</a>`);
    });
    const excludedCount = excludedItems.length;
    // One row above the tree: the excluded-treebanks chevron on the left (its
    // chips open to the right of it) and the include-unk switch at the right
    // end. The open state is remembered per browser so it survives moving
    // between pages, e.g. via the switch.
    let storedOpen = false;
    try { storedOpen = localStorage.getItem('excludedOpen') === '1'; } catch (e) {}
    const excludedOpen = storedOpen;
    const excludedCurrent = nav.items.some(it => it.excluded && it.current);
    const rowParts = [];
    if (excludedCount) {
      const groups = new Map();
      excludedItems.forEach(x => { if (!groups.has(x.key)) groups.set(x.key, []); groups.get(x.key).push(x.chip); });
      const groupsHtml = [...groups].map(([reason, chips]) =>
        `<div class="tb-excl-group">${chips.join('')}<span class="tb-excl-reason">${esc(reason)}</span></div>`).join('');
      rowParts.push(`<div class="tb-excl-wrap"><button type="button" class="tb-excluded-toggle${excludedCurrent ? ' has-current' : ''}" id="excludedToggle" aria-expanded="${excludedOpen}">${excludedOpen ? '▾' : '▸'} Excluded from pairs (${excludedCount})</button>` +
        `<div class="tb-excluded" id="excludedList"${excludedOpen ? '' : ' hidden'}>${groupsHtml}</div></div>`);
    }
    if (nav.counterpartHref) {
      rowParts.push(`<a class="unk-toggle${unkMode ? ' on' : ''}" href="${nav.counterpartHref}" role="switch" aria-checked="${unkMode}"
        title="${unkMode ? 'Debugging view is on -- click to go back to the tree fit without unk rows' : 'Debugging view: same treebank, tree also fit on its unk rows'}"><span class="unk-switch"><span class="unk-knob"></span></span>Include rows missing annotation ("unk")</a>`);
    }
    if (rowParts.length) pills.push(`<div class="tb-controls">${rowParts.join('')}</div>`);
    treebankRow.innerHTML = pills.join('');
    treebankRow.style.display = '';
    const excludedToggle = document.getElementById('excludedToggle');
    if (excludedToggle) {
      excludedToggle.addEventListener('click', () => {
        const list = document.getElementById('excludedList');
        list.hidden = !list.hidden;
        excludedToggle.setAttribute('aria-expanded', String(!list.hidden));
        excludedToggle.textContent = `${list.hidden ? '▸' : '▾'} Excluded from pairs (${excludedCount})`;
        try { localStorage.setItem('excludedOpen', list.hidden ? '0' : '1'); } catch (e) {}
        scheduleRefit();
      });
    }
    const overview = document.querySelector('.overview-link');
    if (overview && nav.overviewHref) overview.setAttribute('href', nav.overviewHref);
  }

  function buildTreeSelector() {
    treeSelectRow.innerHTML = '';
    // A real per-language page only ever has one tree -- the selector row
    // (built for comparing multiple trees side by side) has nothing to
    // switch between, so it's not shown at all rather than rendering as a
    // single, unclickable-feeling button.
    if (Object.keys(TREES).length <= 1) { treeSelectRow.style.display = 'none'; return; }
    Object.entries(TREES).forEach(([key, tree]) => {
      const keepLeaves = Object.entries(tree.NODES).filter(([, n]) => n.keep);
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tree-select-btn' + (key === currentTreeKey ? ' active' : '');
      btn.innerHTML = `${tree.title.split(' · ')[0]}<span class="keep-count">🔑×${keepLeaves.length}</span>`;
      btn.addEventListener('click', () => selectTree(key));
      treeSelectRow.appendChild(btn);
    });
  }

  // Blue "current" outline covers the whole root→currentNode route, not just
  // the node itself, so you can see how you got there at a glance.
  function markCurrentPath() {
    const onPath = new Set(drawerOpen ? T.PATHS[currentNode] : []);
    document.querySelectorAll('.node-slot').forEach(el => {
      el.classList.toggle('current', onPath.has(Number(el.dataset.node)));
    });
  }

  // Floating info panel -- title/accuracy/meta rows straight from T.META,
  // and the "Classes · dataset distribution" swatch+count+bar rows (same
  // convention, same "unk" bucket dimmed to opacity 0.35 at zero count) from
  // T.CLASSES -- both read from decision_trees/{cond}/{lang}.html's own
  // info-panel, not recomputed here.
  const META_ROWS = [
    ['Language', 'languageName'], ['Treebank', 'treebank'], ['Excluded from pairs', 'excludedReason'], ['Keep threshold', 'keepThreshold'], ['train accuracy', 'accuracy'], ['test accuracy', 'testAccuracyRow'],
    ['base entropy', 'baseEntropy'], ['reduced entropy', 'reducedEntropy'],
    ['root accuracy', 'rootAccuracy'], ['train accuracy (smoothed)', 'trainAccuracy'],
    ['Nodes', 'nodes'], ['Depth', 'depth'],
    ['Training samples', 'trainingSamples'], ['Predictor', 'predictor'],
  ];
  function buildInfoPanel() {
    // Pages built before languageName existed only carry the combined name.
    if (T.META.languageName === undefined) T.META.languageName = T.META.language;
    if (T.META.testAccuracy) T.META.testAccuracyRow = `${T.META.testAccuracy} (n=${T.META.testN})`;
    else META_ROWS[META_ROWS.findIndex(r => r[1] === 'accuracy')][0] = 'accuracy';
    infoPanelTitle.textContent = T.META.language;
    // Train = accuracy on the rows the tree was fit on; test = on its held-out
    // split. Pages built before the test figure existed just show "accuracy".
    infoPanelAccuracy.textContent = T.META.testAccuracy
      ? `train ${T.META.accuracy} · test ${T.META.testAccuracy}`
      : `${T.META.accuracy} accuracy`;
    infoPanelMeta.innerHTML = META_ROWS.filter(([, key]) => T.META[key] !== undefined && !(T.META.measure === 'accuracy' && key === 'accuracy')).map(([label, key]) => `
      <div class="meta-row"><span class="meta-key">${label}</span><span class="meta-val">${T.META[key]}</span></div>`).join('');

    const maxCnt = Math.max(...T.CLASSES.map(c => c.cnt), 1);
    const excluded = new Set(T.META.excludedClasses || []);
    classDistLegend.innerHTML = T.CLASSES.map(c => `
      <div class="class-dist-row" style="${c.cnt === 0 ? 'opacity:0.35' : excluded.has(c.cls) ? 'opacity:0.45' : ''}"${excluded.has(c.cls) ? ' title="Not used in this tree\'s fit -- shown for context"' : ''}>
        <span class="class-dist-swatch" style="background:${c.color}"></span>
        <span class="class-dist-label">${displayLabel(c.cls)}</span>
        <span class="class-dist-count">${c.cnt.toLocaleString()}</span>
        <div class="class-dist-bar-track">
          <div class="class-dist-bar-fill" style="width:${(c.cnt / maxCnt * 100).toFixed(1)}%; background:${c.color}"></div>
        </div>
      </div>`).join('');
  }

  minimizeBtn.addEventListener('click', () => {
    const minimized = infoPanel.classList.toggle('minimized');
    minimizeBtn.textContent = minimized ? '+' : '−';
    minimizeBtn.title = minimized ? 'Expand panel' : 'Minimize panel';
  });

  function currentTheme() {
    const attr = document.documentElement.getAttribute('data-theme');
    if (attr === 'light' || attr === 'dark') return attr;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  function updateThemeToggleBtn() {
    themeToggleBtn.textContent = currentTheme() === 'dark' ? '☀' : '☾';
  }
  themeToggleBtn.addEventListener('click', () => {
    const next = currentTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('sva-dt-theme', next); } catch (e) {}
    updateThemeToggleBtn();
  });
  updateThemeToggleBtn();

  let showNodeDist = true;
  distToggleRow.addEventListener('click', () => {
    showNodeDist = !showNodeDist;
    distToggleSwitch.classList.toggle('off', !showNodeDist);
    document.querySelectorAll('.node-dist-bar-wrap').forEach(el => { el.style.display = showNodeDist ? '' : 'none'; });
  });

  function selectTree(key) {
    if (key === currentTreeKey) return;
    currentTreeKey = key;
    T = TREES[key];
    CANVAS_W = T.CANVAS_W; CANVAS_H = T.CANVAS_H;
    currentNode = T.defaultNode;
    active.clear();
    openLabels.clear();
    openRouteLabels.clear();
    // Leaf ids aren't unique across trees (both demo trees happen to have a
    // leaf "3"), so leaving these set would leak one tree's open/highlight
    // state onto the other tree's same-numbered leaf.
    openLeaves.clear();
    activePairKey = null;
    document.querySelectorAll('.tree-select-btn').forEach((el, i) => {
      el.classList.toggle('active', Object.keys(TREES)[i] === key);
    });
    treeTitle.textContent = T.title;
    drawBaseTree();
    sizeTreeBox();
    fitToContent();
    markCurrentPath();
    buildInfoPanel();
    buildSampleGrid();
    buildPairsList();
    render();
  }

  function selectNode(id) {
    // Traces don't survive a node change: leaving them active let a leaf
    // flag from a node you're no longer looking at linger indefinitely,
    // which read as stale rather than as an intentional cross-node
    // comparison.
    if (id !== currentNode) active.clear();
    currentNode = id;
    markCurrentPath();
    buildSampleGrid();
    buildPairsList();
    render();
  }

  function render() {
    ringsLayer.innerHTML = '';

    // Node rings use the per-sample palette, since they're the one place
    // that's actually comparing *which* traced sample(s) reach a node -- but
    // the root is excluded: every route starts there, so a ring on it never
    // carries any information.
    const rootId = Object.entries(T.NODES).find(([, n]) => n.branch === 'root')[0];
    const nodeUsers = {};
    active.forEach((color, key) => {
      T.PATHS[key.split('_')[0]].forEach(n => {
        if (String(n) === rootId) return;
        (nodeUsers[n] = nodeUsers[n] || []).push(color);
      });
    });
    Object.entries(nodeUsers).forEach(([nodeId, colors]) => {
      const node = T.NODES[nodeId];
      colors.forEach((color, i) => {
        const ring = ns('rect');
        const inset = -6 - i * 6;
        ring.setAttribute('x', node.x - 84 + inset);
        ring.setAttribute('y', node.y - 23 + inset);
        ring.setAttribute('width', 168 - inset * 2);
        ring.setAttribute('height', 46 - inset * 2);
        ring.setAttribute('rx', 8 - inset * 0.1);
        ring.classList.add('ring');
        ring.setAttribute('stroke', `var(${color})`);
        ringsLayer.appendChild(ring);
      });
    });
  }

  // Which classes currently have their feature tables open -- one switch
  // per class (Yes/No), not one for the whole node: opening Yes's up-to-5
  // rows together (so their columns line up for comparison) shouldn't also
  // open No's, since they're a separate group with nothing to compare
  // against Yes row-for-row.
  let openLabels = new Set();
  // Same idea one level down: which label groups have their "why this row"
  // route tables open. Separate from openLabels (the feature tables that
  // contain them), so opening one never opens the other.
  let openRouteLabels = new Set();

  // Which leaves currently have every one of their pairs' feature tables
  // open -- keyed by leafId, not per-pair: a leaf's pairs have no Yes/No
  // subdivision to open independently, so any one "features" button for a
  // leaf (there's one per pair, plus one on the leaf's heading row) toggles
  // all of that leaf's pairs together.
  let openLeaves = new Set();
  // The single most-recently-clicked pair ("leafId_i"), toggled independently
  // of openLeaves above -- clicking a card only ever changes which one card
  // is highlighted (or clears it, clicking the same one twice), never touches
  // feature-table visibility.
  let activePairKey = null;

  // Runs `mutate`, then scrolls the page by however far the element tagged
  // data-scroll-anchor="anchorValue" moved vertically as a result -- so
  // whatever a person just clicked (a "features" toggle, a pair card) stays
  // under their eye instead of the page jumping when content above or
  // around it changes height. Re-queries by a stable data attribute rather
  // than keeping clickedEl's own reference because buildPairsList() (and,
  // in principle, any other full-rebuild caller) replaces the whole list on
  // every call -- the original element is gone, but whatever it represents
  // (a leaf's header button, a specific pair, a sample row) still has a
  // stable identifying attribute to find its replacement by. Works just as
  // well for callers that mutate in place (setLabelFeatsOpen never rebuilds
  // anything) since re-querying the same still-present element is harmless.
  function preservingScroll(clickedEl, anchorValue, mutate) {
    const before = clickedEl.getBoundingClientRect().top;
    mutate();
    const after = document.querySelector(`[data-scroll-anchor="${CSS.escape(anchorValue)}"]`);
    // scrollPane, not window: samples/pairs now scroll inside their own
    // pane (see .scroll-pane), not the page/window itself, which stays
    // fixed so the tree above never scrolls out of view.
    if (after) scrollPane.scrollBy(0, after.getBoundingClientRect().top - before);
  }

  // Wires single- and double-click as genuinely distinct actions on the
  // same element, not just an addition on top of each other: a native
  // dblclick fires *after* two ordinary click events already have, so a
  // plain "click" + "dblclick" listener pair still runs onSingle twice
  // (each its own unprotected rebuild/scroll-jump) before onDouble ever
  // gets a turn -- by the time onDouble's own preservingScroll runs, it's
  // only protecting against its own mutation, not undoing the jump those
  // two already caused. Delaying onSingle instead, and swallowing it
  // entirely when a second click arrives within the window, means a real
  // double-click runs onDouble alone.
  function onSingleOrDoubleClick(el, onSingle, onDouble) {
    let pending = null;
    el.addEventListener('click', () => {
      if (pending) {
        clearTimeout(pending);
        pending = null;
        return;
      }
      pending = setTimeout(() => { pending = null; onSingle(); }, 300);
    });
    el.addEventListener('dblclick', () => onDouble());
  }

  function setLabelRouteOpen(label, open) {
    if (open) openRouteLabels.add(label); else openRouteLabels.delete(label);
    document.querySelectorAll(`.route-block[data-label="${CSS.escape(label)}"] .route-body`).forEach(el => { el.hidden = !open; });
    document.querySelectorAll(`.group-route-toggle[data-label="${CSS.escape(label)}"]`).forEach(btn => {
      btn.textContent = (open ? '▾' : '▸') + ' ' + btn.dataset.text;
      btn.setAttribute('aria-expanded', String(open));
    });
  }

  function setLabelFeatsOpen(label, open) {
    if (open) openLabels.add(label); else openLabels.delete(label);
    document.querySelectorAll(`#sampleGrid tr.feat-row[data-label="${CSS.escape(label)}"]`).forEach(el => { el.hidden = !open; });
    // Every row in this label group now carries its own "features" button
    // (plus the one on the group header) -- all of them need their label
    // text kept in sync, not just a single button, since any one of them
    // can be the one that triggered this.
    document.querySelectorAll(`.group-feats-toggle[data-label="${CSS.escape(label)}"]`).forEach(btn => {
      btn.textContent = (open ? '▾' : '▸') + ' features';
      btn.setAttribute('aria-expanded', String(open));
    });
    if (open) alignFeatLabelCols();
  }

  // sharedCols (above) already keeps the data columns identical across all
  // 5 samples' tables; the one column it can't fix is the row-label cell
  // itself, since its width comes from the actual nsubj/verb token text --
  // a one-letter Greek pronoun next to a ten-letter noun -- which a shared
  // *set* of columns says nothing about. Measuring the widest one actually
  // rendered and applying it to all of them (rather than guessing a fixed
  // CSS width that's either wasteful or too narrow for a real outlier)
  // finishes the alignment exactly. Only real once the rows are unhidden --
  // a hidden row's cells measure 0-width -- so this runs after that, not at
  // build time.
  function alignFeatLabelCols() {
    ['role-label-cell', 'role-form-cell'].forEach(cls => {
      const cells = [...document.querySelectorAll(`#sampleGrid tr.feat-row:not([hidden]) .feat-mini-table tbody th.${cls}`)];
      if (!cells.length) return;
      cells.forEach(c => { c.style.width = ''; });
      const maxW = Math.max(...cells.map(c => c.getBoundingClientRect().width));
      cells.forEach(c => { c.style.width = maxW + 'px'; });
    });
  }

  // Auto-derived from T.NODES/T.PATHS alone: the chain of split rules and the
  // branch (True/False, sklearn's own right/left convention) taken at each
  // one to reach this node from the root. No hand-written interpretation.
  function buildBreadcrumb(nodeId) {
    const path = T.PATHS[nodeId];
    if (path.length === 1) return '<i>Root — no decisions yet.</i>';
    const steps = [];
    for (let i = 0; i < path.length - 1; i++) {
      const parent = T.NODES[path[i]];
      const child = T.NODES[path[i + 1]];
      const branch = child.branch === 'true' ? 'True' : 'False';
      steps.push(`<code>${parent.rule}</code> → <b>${branch}</b>`);
    }
    return steps.join('<br>');
  }

  function buildSampleGrid() {
    const node = T.NODES[currentNode];
    sampleGridTitle.textContent = `Node ${currentNode} samples`;
    nodeNote.innerHTML = `<span class="node-note-title">About node ${currentNode} · route ${T.PATHS[currentNode].join(' → ')}</span>${buildBreadcrumb(currentNode)}`;
    nodeDistDetail.innerHTML = node.dist ? buildDistColumns(node.dist, 56) : '';
    sampleGrid.innerHTML = '';

    const samples = T.NODE_SAMPLES[currentNode];
    // One shared column set for every sample's feature table (rather than
    // each computing its own from just its two rows), so e.g. Mood/Case/
    // VerbForm land in the same position across all 5 -- otherwise a
    // feature only some samples have shifts every later column sideways
    // from row to row, and nothing lines up for comparison.
    const sharedCols = featColumns(samples.flatMap(s => [s.nsubjFeats, s.verbFeats]));

    function addRow(s, idx, displayIdx) {
      const key = currentNode + '_' + idx;
      const color = active.get(key);

      const row = document.createElement('tr');
      row.className = 'sample-row' + (active.has(key) ? ' active' : '');
      row.tabIndex = 0;
      row.setAttribute('role', 'button');
      row.setAttribute('aria-pressed', String(active.has(key)));
      row.dataset.key = key;
      if (color) {
        row.style.setProperty('--sample-color', `var(${color})`);
        row.style.setProperty('--sample-color-light', `var(${color}-light)`);
      }

      row.innerHTML = `
        <td class="col-idx">${displayIdx}</td>
        <td class="col-sentence">${tagRoleTokens(s.sentence, s.nsubj, s.verb)}</td>
        <td class="col-link">
          <button type="button" class="group-feats-toggle" data-label="${s.label}" data-scroll-anchor="samplerow_${key}" aria-expanded="${openLabels.has(s.label)}">${openLabels.has(s.label) ? '▾' : '▸'} features</button>
          <a href="${s.treebankLink}" target="_blank" rel="noopener" title="${s.treebankName}">↗</a>
        </td>
      `;

      const featRow = document.createElement('tr');
      featRow.className = 'feat-row';
      featRow.dataset.label = s.label;
      featRow.hidden = !openLabels.has(s.label);
      featRow.innerHTML = `<td colspan="3">${buildFeatTable(T.decisiveFeat, [
        { label: T.roleA, form: s.nsubj, feats: s.nsubjFeats, role: 'a' },
        { label: T.roleB, form: s.verb, feats: s.verbFeats, role: 'b' },
      ], sharedCols)}${buildRouteTable(s, key)}</td>`;
      featRow.querySelectorAll('.group-route-toggle').forEach(btn => {
        btn.addEventListener('click', () => {
          preservingScroll(btn, `routerow_${key}`, () => setLabelRouteOpen(s.label, !openRouteLabels.has(s.label)));
        });
      });

      row.querySelector('a').addEventListener('click', e => e.stopPropagation());
      const featBtn = row.querySelector('.group-feats-toggle');
      featBtn.addEventListener('click', e => {
        e.stopPropagation();
        preservingScroll(featBtn, `samplerow_${key}`, () => setLabelFeatsOpen(s.label, !openLabels.has(s.label)));
      });
      const toggleTrace = () => {
        if (active.has(key)) {
          active.delete(key);
        } else {
          // Cap at one active sample per node: every row in this table
          // already shares the identical route to currentNode, so a second
          // traced sample here would only add color, not new path
          // information -- multi-select still works across nodes, where it
          // shows where different samples' routes diverge.
          [...active.keys()].forEach(k => {
            if (k.split('_')[0] === currentNode) active.delete(k);
          });
          active.set(key, nextColor());
        }
        buildSampleGrid();
        render();
      };
      // Double-click anywhere on the row is a shortcut for the row's own
      // "features" button -- same toggle, same target, just discoverable
      // without hunting for the small button specifically.
      onSingleOrDoubleClick(row, toggleTrace, () => {
        preservingScroll(featBtn, `samplerow_${key}`, () => setLabelFeatsOpen(s.label, !openLabels.has(s.label)));
      });
      row.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleTrace(); }
      });

      sampleGrid.appendChild(row);
      sampleGrid.appendChild(featRow);
    }

    // Group the up-to-5 shown rows by label, each under a header giving the
    // node's real total for that label (from node.dist, the same real
    // per-node counts the tree's own distribution bar/chart draw from) --
    // "showing 3 of 14,838 (98.9% of this node)" instead of a flat list
    // that never says how many rows exist beyond the ones shown.
    const byLabel = new Map();
    samples.forEach((s, idx) => {
      if (!byLabel.has(s.label)) byLabel.set(s.label, []);
      byLabel.get(s.label).push(idx);
    });
    // Order groups the same way node.dist does (Yes/yes before No/no) when
    // possible, so the table's group order matches the tree's own bars.
    const distOrder = (node.dist || []).map(d => d.cls);
    const labels = [...byLabel.keys()].sort((a, b) => distOrder.indexOf(a) - distOrder.indexOf(b));

    labels.forEach(label => {
      const idxs = byLabel.get(label);
      const distEntry = (node.dist || []).find(d => d.cls === label);
      if (distEntry) {
        const isOpen = openLabels.has(label);
        const pct = (distEntry.cnt / node.n * 100).toFixed(1);
        const header = document.createElement('tr');
        header.className = 'sample-group-header';
        header.dataset.label = label;
        header.innerHTML = `<td colspan="3"><div class="group-header-row">
          <span class="group-swatch" style="background:${classColor(label)}"></span>
          <span class="group-label">${displayLabel(label)}</span>
          <span class="group-n">showing ${idxs.length} of ${distEntry.cnt.toLocaleString()} (${pct}% of this node)</span>
          ${T.PATHS[currentNode].length > 1 ? `<button type="button" class="group-route-toggle" data-label="${label}" data-text="route" data-scroll-anchor="routehdr_${label}" aria-expanded="${openRouteLabels.has(label)}">${openRouteLabels.has(label) ? '▾' : '▸'} route</button>` : ''}
          <button type="button" class="group-feats-toggle" data-label="${label}" data-scroll-anchor="samplehdr_${label}" aria-expanded="${isOpen}">${isOpen ? '▾' : '▸'} features</button>
        </div></td>`;
        const routeHdrBtn = header.querySelector('.group-route-toggle');
        if (routeHdrBtn) routeHdrBtn.addEventListener('click', () => {
          preservingScroll(routeHdrBtn, `routehdr_${label}`, () => setLabelRouteOpen(label, !openRouteLabels.has(label)));
        });
        const hdrBtn = header.querySelector('.group-feats-toggle');
        hdrBtn.addEventListener('click', () => {
          preservingScroll(hdrBtn, `samplehdr_${label}`, () => setLabelFeatsOpen(label, !openLabels.has(label)));
        });
        sampleGrid.appendChild(header);
      }
      idxs.forEach((idx, i) => addRow(samples[idx], idx, i + 1));
    });
    if (openLabels.size) alignFeatLabelCols();
    buildLabelJumps(labels, node);
  }

  // One chip per label present in this node's samples, jumping to that
  // label's group in the table -- including a unanimous (single-label)
  // node's one chip: that count is still real signal (how many of this
  // node's n it covers), not just a jump target, so it stays visible
  // rather than only showing up once there's something to jump between.
  function buildLabelJumps(labels, node) {
    drawerLabels.innerHTML = '';
    if (labels.length >= 1) {
      labels.forEach(label => {
        const entry = (node.dist || []).find(d => d.cls === label);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'label-jump';
        btn.title = `Jump to the ${displayLabel(label)} samples`;
        btn.innerHTML = `<span class="swatch" style="background:${classColor(label)}"></span>${displayLabel(label)}` +
          (entry ? `<span class="n">${entry.cnt.toLocaleString()}</span>` : '');
        btn.addEventListener('click', () => {
          // From the Pairs tab, jump means "show me these samples".
          if (drawerTab !== 'samples') setDrawerTab('samples');
          const header = sampleGrid.querySelector(`tr.sample-group-header[data-label="${CSS.escape(label)}"]`);
          if (!header) return;
          header.scrollIntoView({ behavior: 'smooth', block: 'start' });
          const row = header.querySelector('.group-header-row');
          row.classList.remove('jump-flash');
          void row.offsetWidth;
          row.classList.add('jump-flash');
        });
        drawerLabels.appendChild(btn);
      });
    }
    updateLabelJumps();
  }
  function updateLabelJumps() {
    drawerLabels.hidden = !drawerLabels.children.length;
  }

  function nodeHasPairs(id) {
    const n = T.NODES[id];
    return !!(n && n.leaf && n.keep && T.PAIRS.some(p => String(p.leaf) === String(id)));
  }
  // The Pairs tab is only usable on a leaf that generated pairs; if the
  // drawer is on it when the selection moves elsewhere, fall back to Samples.
  function syncPairsTab() {
    const ok = nodeHasPairs(currentNode);
    tabPairs.disabled = !ok;
    tabPairs.title = ok ? '' : 'Only kept leaves that generated pairs have a Pairs view';
    if (!ok && drawerTab === 'pairs') setDrawerTab('samples');
  }

  function buildPairsList() {
    pairsList.innerHTML = '';
    // Pages without a keep threshold (per-treebank trees) generate no pairs.
    if (T.META.keepThresholdAcc == null) { pairsCard.style.display = 'none'; tabPairs.hidden = true; drawerPairRoles.hidden = true; return; }
    // Pairs belong to leaves: only the selected node's own pairs are shown,
    // and only when it is a kept leaf that actually generated some. T.PAIRS
    // itself is already capped server-side (html_tree._v2_build_pairs, up
    // to 10 rows per reinflection direction per leaf -- a leaf's real
    // correct_swaps.parquet can run into the thousands), so nothing further
    // needs capping here; allPairs below IS what renders.
    const keepLeaves = nodeHasPairs(currentNode) ? [String(currentNode)] : [];
    syncPairsTab();
    const pairsByLeaf = keepLeaves.map(leafId => [leafId, T.PAIRS.filter(p => String(p.leaf) === String(leafId))]);
    const shownTotal = pairsByLeaf.reduce((sum, [, all]) => sum + all.length, 0);
    pairsTitle.textContent = keepLeaves.length
      ? `🔑 Generated minimal pairs · leaf ${keepLeaves[0]} (${shownTotal} shown)`
      : `No minimal pairs for node ${currentNode}`;
    updateDrawerHint();

    // Which leaf/leaves, how many kept, and acc vs. the keep threshold are all
    // already on the node badges above (and repeated in pairsTitle just
    // above this); this only needs to add what those don't already say --
    // that these specific pairs come straight from correct_swaps.parquet.
    pairsIntro.textContent = keepLeaves.length ? `Minimal pairs from leaf ${keepLeaves[0]}` : '';
    buildPairRoleJumps(keepLeaves.length ? keepLeaves[0] : null);

    pairsByLeaf.forEach(([leafId, leafPairs]) => {
      if (leafPairs.length === 0) return;
      const group = document.createElement('div');
      group.className = 'pairs-leaf-group';
      // Stable target for a node's "kept › pairs" badge (see openPairs
      // below) to scroll straight to *this* leaf's group, not just the
      // pairs card in general -- matters once more than one leaf is kept.
      group.setAttribute('data-leaf-group', leafId);
      // One "show features" toggle per leaf, always present (not just once
      // there's more than one kept leaf) -- it opens/closes every one of
      // this leaf's pairs at once, independently of activePairKey below.
      const leaf = T.NODES[leafId];
      const allOpen = openLeaves.has(leafId);
      const headingRow = document.createElement('div');
      headingRow.className = 'pairs-leaf-heading-row';
      const shownNote = leaf.correctSwaps > leafPairs.length ? `, showing ${leafPairs.length} of ${leaf.correctSwaps.toLocaleString()}` : '';
      const headingHtml = keepLeaves.length > 1
        ? `<span class="pairs-leaf-heading">Leaf ${leafId} <span class="n">— ${leaf.kept.toLocaleString()} kept, ${leaf.correctSwaps ? leaf.correctSwaps.toLocaleString() + ' pairs generated' : ''}${shownNote}</span></span>`
        : '';
      headingRow.innerHTML = `${headingHtml}<button type="button" class="group-feats-toggle" data-scroll-anchor="leafhdr_${leafId}" aria-expanded="${allOpen}">${allOpen ? '▾' : '▸'} features</button>`;
      const leafHdrBtn = headingRow.querySelector('.group-feats-toggle');
      leafHdrBtn.addEventListener('click', () => {
        preservingScroll(leafHdrBtn, `leafhdr_${leafId}`, () => {
          if (allOpen) openLeaves.delete(leafId); else openLeaves.add(leafId);
          buildPairsList();
        });
      });
      group.appendChild(headingRow);

      // Same root-to-leaf rule/branch chain as the node-samples panel's
      // "About node" breadcrumb above, just beneath this leaf's own
      // heading rather than bundled with every leaf's at the top of the
      // card -- auto-derived from T.NODES/T.PATHS, not hand-written, so it
      // can't drift out of sync with the tree itself.
      const pathTrace = document.createElement('div');
      pathTrace.className = 'pairs-leaf-path';
      pathTrace.innerHTML = buildBreadcrumb(leafId);
      group.appendChild(pathTrace);

      const appendPairItem = (p, i) => {
        const key = leafId + '_' + i;
        // Every pair in an open leaf shows its feature table together (no
        // per-pair open state); activePairKey is the single, separate
        // highlight -- only ever one card across the whole page.
        const isOpen = openLeaves.has(leafId);
        const el = document.createElement('div');
        el.className = 'pair-example' + (key === activePairKey ? ' active' : '');
        el.tabIndex = 0;
        el.setAttribute('role', 'button');
        el.setAttribute('aria-pressed', String(key === activePairKey));
        el.setAttribute('data-scroll-anchor', `pair_${key}`);

        // The swapped role is the one create_pairs actually reinflected --
        // roleA (det) for Hindi, roleB (verb) for Greek. Its "swapped_" row
        // is the original row's features with only the decisive feature
        // flipped, exactly what reinflection does.
        const swappedIsA = (p.swapRole || T.swappedRole) === 'A';
        const origRole = swappedIsA ? { label: T.roleA, form: p.nsubj, feats: p.nsubjFeats, role: 'a' } : { label: T.roleB, form: p.verb, feats: p.verbFeats, role: 'b' };
        const otherRole = swappedIsA ? { label: T.roleB, form: p.verb, feats: p.verbFeats, role: 'b' } : { label: T.roleA, form: p.nsubj, feats: p.nsubjFeats, role: 'a' };
        const swappedRow = {
          label: `swapped_${origRole.label}`,
          form: p.ungrammatical,
          feats: applyAfterFeat(origRole.feats, T.decisiveFeat, p.afterValue, p.afterFeatKey, p.bonusAfterFeats, p.siblingKeys),
          variant: 'swapped',
          linked: true,
          role: origRole.role,
        };
        // The swapped sentence has the same two tokens except the swapped
        // role's, which shows the reinflected (ungrammatical) form instead.
        const swapFormA = swappedIsA ? p.ungrammatical : p.nsubj;
        const swapFormB = swappedIsA ? p.verb : p.ungrammatical;

        el.innerHTML = `
          <div class="pair-sentence-row grammatical">
            <span class="mark">✓</span><span class="pair-example-sentence">${tagRoleTokens(p.origSentence, p.nsubj, p.verb)}</span>
            <button type="button" class="group-feats-toggle" data-scroll-anchor="pairitem_${key}" aria-expanded="${isOpen}">${isOpen ? '▾' : '▸'} features</button>
            <a class="pair-link" href="${p.treebankLink}" target="_blank" rel="noopener" title="${p.treebankName}">↗</a>
          </div>
          <div class="pair-sentence-row ungrammatical"><span class="mark">✗</span><span class="pair-example-sentence">${tagRoleTokens(p.swapSentence, swapFormA, swapFormB)}</span></div>
          ${isOpen ? buildFeatTable(T.decisiveFeat, [otherRole, { ...origRole, linked: true }, swappedRow]) : ''}
        `;
        el.querySelector('.pair-link').addEventListener('click', e => e.stopPropagation());
        const itemFeatBtn = el.querySelector('.group-feats-toggle');
        itemFeatBtn.addEventListener('click', e => {
          e.stopPropagation();
          preservingScroll(itemFeatBtn, `pairitem_${key}`, () => {
            if (openLeaves.has(leafId)) openLeaves.delete(leafId); else openLeaves.add(leafId);
            buildPairsList();
          });
        });
        // Only ever changes which single card is highlighted (or clears it,
        // clicking the same one again) -- feature-table visibility is the
        // "features" button's job now, not this click.
        const toggleHighlight = () => {
          activePairKey = (activePairKey === key) ? null : key;
          preservingScroll(el, `pair_${key}`, () => buildPairsList());
        };
        // Double-click anywhere on the card is a shortcut for its own
        // "features" button -- same toggle (all of this leaf's pairs open
        // or close together, same as the button), just discoverable
        // without hunting for the small button specifically.
        onSingleOrDoubleClick(el, toggleHighlight, () => {
          preservingScroll(itemFeatBtn, `pairitem_${key}`, () => {
            if (openLeaves.has(leafId)) openLeaves.delete(leafId); else openLeaves.add(leafId);
            buildPairsList();
          });
        });
        el.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleHighlight(); }
        });
        group.appendChild(el);
      };

      // Group by which component this leaf's pairs actually reinflected
      // (npa.agreement.swap_roles_for_target_col: a no-HEAD pair like
      // DET-ADJ reinflects each role in turn and merges both directions into
      // one bucket) -- same idea as the samples table's byLabel groups, so a
      // leaf that mixes e.g. DET- and ADJ-reinflected pairs shows them as two
      // labelled runs instead of interleaved with no indication of which
      // side was reinflected. A leaf with only one direction (SVA/subj_aux,
      // or NPA's HEAD pairs) renders exactly as before -- no header, one
      // flat list -- since there's nothing to distinguish.
      const byRole = new Map();
      leafPairs.forEach((p, i) => {
        const role = p.swapRole || T.swappedRole;
        if (!byRole.has(role)) byRole.set(role, []);
        byRole.get(role).push(i);
      });
      const roleOrder = ['A', 'B'].filter(r => byRole.has(r));
      if (roleOrder.length > 1) {
        const esc = v => String(v).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
        roleOrder.forEach(role => {
          const idxs = byRole.get(role);
          const roleLabel = displayRole(role === 'A' ? T.roleA : T.roleB);
          const header = document.createElement('div');
          header.className = 'pairs-role-header';
          header.setAttribute('data-role-group', role);
          header.innerHTML = `<span class="pairs-role-label">${esc(roleLabel)} reinflected</span><span class="n">${idxs.length}</span>`;
          group.appendChild(header);
          idxs.forEach(i => appendPairItem(leafPairs[i], i));
        });
      } else {
        leafPairs.forEach((p, i) => appendPairItem(p, i));
      }
      pairsList.appendChild(group);
    });
  }

  // One chip per reinflected component present among the current leaf's
  // pairs (only when the leaf actually mixes both -- see roleOrder above),
  // sitting next to the Pairs tab the same way drawerLabels' Agree/Disagree
  // chips sit next to Samples. Counts come from node.pairRoleCounts -- the
  // REAL per-direction total straight from correct_swaps.parquet, not just
  // however many of that direction happen to be materialized into T.PAIRS
  // -- the same "real distribution, not the capped sample" convention
  // node.dist gives the Agree/Disagree chips (see buildLabelJumps). Jumps
  // to that component's group header (built above) rather than filtering.
  function buildPairRoleJumps(leafId) {
    drawerPairRoles.innerHTML = '';
    const counts = (leafId != null && T.NODES[leafId] && T.NODES[leafId].pairRoleCounts) || {};
    const roleOrder = ['A', 'B'].filter(r => counts[r] > 0);
    if (roleOrder.length > 1) {
      const esc = v => String(v).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
      roleOrder.forEach(role => {
        const roleLabel = displayRole(role === 'A' ? T.roleA : T.roleB);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'label-jump pairs-role';
        btn.title = `Jump to pairs with a reinflected ${roleLabel}`;
        btn.innerHTML = `${esc(roleLabel)}<span class="n">${counts[role].toLocaleString()}</span>`;
        btn.addEventListener('click', () => {
          if (drawerTab !== 'pairs') setDrawerTab('pairs');
          const header = pairsList.querySelector(`[data-role-group="${role}"]`);
          if (!header) return;
          header.scrollIntoView({ behavior: 'smooth', block: 'start' });
          header.classList.remove('jump-flash');
          void header.offsetWidth;
          header.classList.add('jump-flash');
        });
        drawerPairRoles.appendChild(btn);
      });
    }
    drawerPairRoles.hidden = !drawerPairRoles.children.length;
  }

  // ── Samples / pairs drawer ──
  // Click a node: open the drawer on its samples. Click another node: switch
  // to it. Click the highlighted node (or the close button / Esc): close.
  let drawerOpen = false;
  let drawerTab = 'samples';
  const DRAWER_KEY = 'treeDrawerFrac';
  let drawerFrac = 0.4;
  try {
    const v = parseFloat(localStorage.getItem(DRAWER_KEY));
    if (v >= 0.15 && v <= 0.9) drawerFrac = v;
  } catch (e) {}
  function applyDrawerHeight() { drawer.style.height = `${drawerFrac * 100}%`; }
  function updateDrawerHint() {
    drawerHint.textContent = drawerTab === 'pairs'
      ? pairsTitle.textContent
      : 'click a row to trace it · up to 15 real rows per class';
  }
  function setDrawerTab(tab) {
    drawerTab = tab;
    drawer.dataset.tab = tab;
    tabSamples.classList.toggle('active', tab === 'samples');
    tabPairs.classList.toggle('active', tab === 'pairs');
    updateDrawerHint();
    updateLabelJumps();
  }
  function openDrawer(tab) {
    drawerOpen = true;
    drawer.hidden = false;
    applyDrawerHeight();
    setDrawerTab(tab || drawerTab);
  }
  function closeDrawer() {
    drawerOpen = false;
    drawer.hidden = true;
    if (revealShift) { zoom.ty += revealShift / contentScale; revealShift = 0; applyZoom(); }
    active.clear();
    markCurrentPath();
    render();
  }
  // Pan the tree up if the drawer would cover the selected node; the shift is
  // undone when the drawer closes so the tree isn't left displaced.
  let revealShift = 0;
  function revealSelectedNode() {
    const box = nodesLayer.querySelector(`.node-slot[data-node="${CSS.escape(String(currentNode))}"] .node-box`);
    if (!box) return;
    const r = box.getBoundingClientRect();
    const over = r.bottom + 12 - drawer.getBoundingClientRect().top;
    if (over <= 0) return;
    const room = r.top - treeScroll.getBoundingClientRect().top - 8;
    const dy = Math.min(over, Math.max(0, room));
    if (dy > 0) { zoom.ty -= dy / contentScale; revealShift += dy; applyZoom(); }
  }
  function jumpToLeafGroup(id) {
    const group = pairsList.querySelector(`[data-leaf-group="${CSS.escape(String(id))}"]`);
    if (!group) return;
    group.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    // remove + reflow + re-add restarts the flash even on a repeat jump
    group.classList.remove('jump-highlight');
    void group.offsetWidth;
    group.classList.add('jump-highlight');
  }
  function onNodeClick(id) {
    if (drawerOpen && id === currentNode) { closeDrawer(); return; }
    const stayOnPairs = drawerOpen && drawerTab === 'pairs' && nodeHasPairs(id);
    openDrawer(stayOnPairs ? 'pairs' : 'samples');
    selectNode(id);
    revealSelectedNode();
    if (stayOnPairs) setTimeout(() => jumpToLeafGroup(id), 0);
  }
  tabSamples.addEventListener('click', () => setDrawerTab('samples'));
  tabPairs.addEventListener('click', () => setDrawerTab('pairs'));
  document.getElementById('drawerClose').addEventListener('click', closeDrawer);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && drawerOpen) closeDrawer(); });
  let draggingDrawer = false;
  drawerHandle.addEventListener('pointerdown', e => {
    e.preventDefault();
    drawerHandle.setPointerCapture(e.pointerId);
    draggingDrawer = true;
    document.body.classList.add('dragging-drawer');
  });
  drawerHandle.addEventListener('pointermove', e => {
    if (!draggingDrawer) return;
    const rect = treeWrap.getBoundingClientRect();
    drawerFrac = Math.min(0.9, Math.max(0.15, (rect.bottom - e.clientY) / rect.height));
    applyDrawerHeight();
  });
  const endDrawerDrag = () => {
    if (!draggingDrawer) return;
    draggingDrawer = false;
    document.body.classList.remove('dragging-drawer');
    try { localStorage.setItem(DRAWER_KEY, String(drawerFrac)); } catch (e) {}
  };
  drawerHandle.addEventListener('pointerup', endDrawerDrag);
  drawerHandle.addEventListener('pointercancel', endDrawerDrag);

  buildTreeSelector();
  treeTitle.textContent = T.title;
  drawBaseTree();
  sizeTreeBox();
  fitToContent();
  markCurrentPath();
  buildInfoPanel();
  buildTreebankRow();
  sizeTreeBox();
  fitToContent();
  buildSampleGrid();
  buildPairsList();
})();
</script>

</html>
