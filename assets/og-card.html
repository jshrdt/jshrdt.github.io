<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 1200px;
    height: 630px;
    background: #f5f5f4;
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
  }
  .wrap {
    display: flex;
    align-items: center;
    width: 1200px;
    height: 630px;
    padding: 0 80px;
  }
  .text { flex: 1; min-width: 0; }
  .eyebrow {
    display: inline-block;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #b45309;
    background: #fef3c7;
    padding: 8px 18px;
    border-radius: 8px;
    margin-bottom: 28px;
  }
  h1 {
    font-family: 'Source Serif 4', serif;
    font-weight: 500;
    font-size: 72px;
    line-height: 1.1;
    color: #1c1917;
    margin: 0 0 20px;
  }
  .role {
    font-size: 28px;
    color: #57534e;
    margin: 0 0 14px;
  }
  .role strong { color: #1c1917; font-weight: 600; }
  .tagline {
    font-size: 22px;
    color: #78716c;
    margin: 0;
    max-width: 620px;
  }
  .avatar {
    flex-shrink: 0;
    width: 320px;
    height: 320px;
    border-radius: 50%;
    object-fit: cover;
    object-position: 55% 28%;
    transform: scale(0.95) translate(3%, -3%);
    border: 3px solid #e7e5e4;
    margin-left: 60px;
  }
  .url {
    position: absolute;
    bottom: 40px;
    left: 80px;
    font-size: 20px;
    letter-spacing: 0.04em;
    color: #a8a29e;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="text">
      <span class="eyebrow">Natural Language Processing</span>
      <h1>Jacob Lee Suchardt</h1>
      <p class="role"><strong>PhD Student</strong> @ LION Lab, Leipzig University</p>
      <p class="tagline">Cross-lingual morphosyntax, phonetics &amp; phonology &mdash; and what they reveal about multilingual language models.</p>
    </div>
    <img class="avatar" src="avatar.jpg" alt="">
  </div>
  <div class="url">jshrdt.github.io</div>
</body>
</html>
